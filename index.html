<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tom's Violin Studio 網上學堂</title>
  <meta name="description" content="由 Tom sir 親自示範的小提琴網上課程，廣東話教學。兒童及成人均有合適課程，在家按自己的進度學習。">
  <meta property="og:title" content="Tom's Violin Studio 網上學堂">
  <meta property="og:description" content="由 Tom sir 親自示範的小提琴網上課程，廣東話教學。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-white focus:px-4 focus:py-2">跳至主要內容</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="bg-cream">
      <div class="container-page flex flex-wrap items-center gap-10 py-12 sm:py-20 lg:gap-14">
        <div class="flex min-w-0 flex-[1_1_26rem] flex-col gap-5">
          <div class="text-sm font-medium tracking-[0.1em] text-[#6B5320]">網上學堂 · 廣東話教學</div>
          <h1 class="font-serif text-[34px] font-bold leading-tight sm:text-5xl lg:text-[52px]">打好基礎<br>是進步的關鍵</h1>
          <p class="max-w-[30em] text-base leading-8 text-[#4A4136] sm:text-lg">由 Tom sir 親自示範，在家按自己的進度學習小提琴，兒童及成人均有合適課程。</p>
          <a href="#courses" class="btn-primary mt-1 w-full sm:w-auto sm:self-start">瀏覽所有課程</a>
        </div>
        <div class="flex aspect-[4/3] min-w-0 flex-[1_1_24rem] items-center justify-center rounded-2xl bg-line text-sm text-[#6B6256]">[Tom sir 教學相片]</div>
      </div>
    </section>

    <section id="courses" class="container-page scroll-mt-6 pt-14 sm:pt-20">
      <h2 class="section-title mb-6 sm:mb-8">課程</h2>
      <div id="course-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" aria-live="polite">
        <div class="card h-80 animate-pulse bg-white/60"></div>
        <div class="card h-80 animate-pulse bg-white/60"></div>
      </div>
    </section>

    <section id="about" class="container-page scroll-mt-6 pt-16 sm:pt-24">
      <div class="flex flex-wrap items-center gap-8 sm:gap-10">
        <div class="flex h-36 w-36 shrink-0 items-center justify-center rounded-full bg-line text-sm text-[#6B6256] sm:h-56 sm:w-56">[相片]</div>
        <div class="flex min-w-0 flex-[1_1_24rem] flex-col gap-3">
          <h2 class="section-title">關於 Tom sir</h2>
          <p class="text-[15px] text-muted">YouTube 頻道「Tom's Violin Studio」逾 4,000 位訂閱者</p>
          <p class="text-base leading-8 text-[#4A4136]">[Tom sir 教學經驗、資歷及教學理念簡介]</p>
        </div>
      </div>
    </section>

    <section id="offline" class="container-page scroll-mt-6 pt-14 sm:pt-20">
      <div class="card flex flex-wrap items-center justify-between gap-5 p-6 sm:p-9">
        <div class="flex flex-col gap-2">
          <h2 class="font-serif text-xl font-bold sm:text-2xl">希望參加實體課程？</h2>
          <p class="text-[15px] leading-7 text-muted sm:text-base">Tom's Violin Studio 同時提供實體小組班及私人課程。</p>
        </div>
        <a href="#" class="btn-outline px-6 py-3 text-[15px]" data-whatsapp>WhatsApp 查詢</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
